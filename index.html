<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lep Quest</title>
<style>
:root{--bg:#161a33;--card:#262b52;--ac:#ffcf33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#w{position:relative;width:min(100vw,calc(100dvh*960/544),960px)}
canvas{width:100%;display:block;aspect-ratio:960/544;background:#000;border-radius:10px;touch-action:none}
#m{position:absolute;inset:0;background:rgba(15,18,40,.94);border-radius:10px;overflow:auto;padding:14px;box-sizing:border-box;text-align:center}
h1{margin:0 0 4px;color:var(--ac);font-size:clamp(22px,5vw,38px)}
p{margin:4px 0 10px;opacity:.8;font-size:13px}
input{font:inherit;padding:10px;border-radius:10px;border:0;width:min(260px,80%);text-align:center}
button{font:inherit;border:0;border-radius:10px;cursor:pointer;color:#fff;background:var(--card)}
.t{padding:8px 10px;margin:3px;font-size:13px}.t.on{background:var(--ac);color:#222;font-weight:700}
.t:disabled,.l:disabled{opacity:.3;cursor:not-allowed}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;max-width:640px;margin:10px auto}
.l{padding:12px 0;font-size:15px}.l.dn{background:#2e7d32}
#tc{display:none;position:absolute;left:0;right:0;bottom:0;justify-content:space-between;align-items:flex-end;padding:8px;box-sizing:border-box;pointer-events:none}
#tc div{display:flex;gap:10px;align-items:flex-end}
#tc button{pointer-events:auto;width:clamp(48px,11vmin,72px);height:clamp(48px,11vmin,72px);border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.45);font-size:22px;touch-action:none}
#tc button[data-k=j],#tc button[data-k=a]{width:clamp(56px,14vmin,86px);height:clamp(56px,14vmin,86px)}
#tc button:active{background:rgba(255,255,255,.6)}
@media (pointer:coarse){#w{width:min(100vw,calc(100dvh*960/544))}#tc{display:flex}}
@media (pointer:coarse) and (orientation:portrait){#tc{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));padding:0 12px}#tc button{width:64px;height:64px}#hint{display:block}}
@media (max-height:520px){h1{font-size:22px!important}#m{padding:8px}.mb{gap:6px;margin:8px auto}.mb button{padding:8px;font-size:15px}.l{padding:8px 0}.ic{font-size:24px}p{margin:2px 0 6px}}
body.mn #tc{display:none!important}
#hint{display:none;font-size:13px;opacity:.8;text-align:center;padding:4px}
html,body{touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{height:100dvh}#m{touch-action:pan-y}input{user-select:text;-webkit-user-select:text}
.mb{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:18px auto}.mb button{padding:14px;font-size:18px;font-weight:700;background:linear-gradient(#3b4390,#2a2f66);box-shadow:0 3px 0 #141838}
button:hover:not(:disabled){filter:brightness(1.2)}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;max-width:640px;margin:10px auto}.c{background:var(--card);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:center}.ic{font-size:34px}.c button{background:var(--ac);color:#222;font-weight:700;padding:6px 10px}.c button:disabled{background:#555;color:#aaa}
.row{display:flex;justify-content:space-between;align-items:center;max-width:380px;margin:6px auto;background:var(--card);padding:6px 10px;border-radius:10px}
</style></head><body>
<div id="w"><canvas id="c"></canvas><div id="m"></div>
<div id="tc"><div><button data-k="l">◀</button><button data-k="r">▶</button></div><div><button data-k="m">☰</button><button data-k="s">⇄</button><button data-k="a">⚔</button><button data-k="j">⤒</button></div></div></div>
<div id="hint">↻ Rotate your phone sideways for a bigger view</div>
<script>
const $=i=>document.getElementById(i),C=$('c'),X=C.getContext('2d'),T=32,VW=960,VH=544,RW=17;
C.width=VW;C.height=VH;
const CH=[
{n:'Sunny Meadow',L:20,s:['#6fd3ff','#e3f8ff'],g:'#5cc83a',d:'#8b5a2b',q:'#ff6a00',m:'#e0457b',fx:0,h:'#7fe06a'},
{n:'Whisper Forest',L:22,s:['#2f7a5a','#a8e6a0'],g:'#3d9a3d',d:'#5a3b22',q:'#9be12a',m:'#8e5bd6',fx:1,h:'#2f8f4f'},
{n:'Golden Desert',L:24,s:['#ffb347','#ffe9a8'],g:'#e8c26a',d:'#b98a3e',q:'#ff4a1c',m:'#3aa57a',fx:2,h:'#e0a64a'},
{n:'Frozen Peaks',L:25,s:['#9fd3f5','#f2fbff'],g:'#f4fbff',d:'#7fa6c4',q:'#2a9dff',m:'#5ac8ff',fx:3,h:'#cfe8f7'},
{n:'Crystal Caves',L:27,s:['#1a1033','#3b2a6b'],g:'#8c7cf0',d:'#2e2556',q:'#ff2bd6',m:'#2bd6c0',fx:4,h:'#3b2a6b'},
{n:'Volcano Rim',L:28,s:['#3a0d0d','#ff7b2e'],g:'#7b5a48',d:'#2c1a14',q:'#ffd000',m:'#ff4d2e',fx:5,h:'#5a2415'},
{n:'Sky Castle',L:30,s:['#0b1030','#6a4fd0'],g:'#d6d6f0',d:'#585a8a',q:'#b455ff',m:'#ffd34d',fx:6,h:'#3a3d78'}];
const WP=[{n:'Sword',cd:18,dmg:1,r:42,hh:34,p:20},{n:'Spear',cd:24,dmg:2,r:66,hh:16,p:50},{n:'Bow',cd:26,p:70,rng:1},{n:'Axe',cd:38,dmg:3,r:54,hh:44,p:100},{n:'Fire Staff',cd:34,p:160,rng:2},{n:'Hammer',cd:56,dmg:5,r:50,hh:50,p:220}],IC=['🗡️','🔱','🏹','🪓','🔥','🔨'],tot=CH.reduce((a,h)=>a+h.L,0);
const toast=t=>{tt=t;tm=140},esc=t=>String(t||'').replace(/[<>&"']/g,'');
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const gi=(c,l)=>CH.slice(0,c).reduce((a,h)=>a+h.L,0)+l;
let ALL;try{ALL=JSON.parse(localStorage.getItem('lqall'))}catch(e){}
if(!ALL||!ALL.p){let o={};try{o=JSON.parse(localStorage.getItem('lqp'))||{}}catch(e){}o.name=o.name||'Player';ALL={cur:o.name,p:{[o.name]:o}}}
let PR=ALL.p[ALL.cur]||{name:'Player'};
const wr=()=>{try{localStorage.setItem('lqall',JSON.stringify(ALL))}catch(e){}};
const sv=()=>{PR={...PR,prog,score,wp,ci,li,gold,own,arrows,binds};ALL.p[PR.name]=PR;ALL.cur=PR.name;wr()};
let M,cols,ens,coins,flagX,flagY,P,cam=0,ci=0,li=0,mc=0,wp=-1,gold=PR.gold||0,own=PR.own||[],arrows=PR.arrows||0,tt='',tm=0,state='menu',score=0,ar=[],pt=[],fr=0,jb=0,prog=PR.prog||0;
const amb=Array.from({length:60},()=>({x:Math.random()*VW,y:Math.random()*VH,s:Math.random()+.5}));
const sol=(x,y)=>x<0||x>=cols?true:(y<0||y>=RW?false:M[x][y]==1);

function mk(tx,ty,R,d,boss){const f=!boss&&R()<.2+d*.2,h=!boss&&!f&&R()<.25,s=boss?54:26,hp=boss?10+ci*3:1+(d*3|0);
 return{x:tx*T,y:f?(ty-2)*T:(ty+1)*T-s,by:(ty-2)*T,x0:tx*T,w:s,h:s,vx:0,vy:0,dir:R()<.5?-1:1,t:R()*6,j:30,k:boss?3:f?2:h?1:0,hp,mh:hp,sp:boss?1.3:.6+d*1.1,fl:0,kb:0,boss}}

function gen(c,l){
 const h=CH[c],R=rng(c*997+l*31+7),d=(c+l/h.L)/7;
 cols=90+l*4+c*8;M=Array.from({length:cols},()=>new Uint8Array(RW));ens=[];coins=[];
 let x=0,gy=12,lg=0;
 const col=(a,t)=>{for(let y=t;y<RW;y++)M[a][y]=1},flat=n=>{for(let i=0;i<n;i++)col(x++,gy)};
 flat(8);
 while(x<cols-14){
  const r=lg?R()*.3:R();lg=0;
  if(r<.3){const n=4+(R()*5|0),x0=x;flat(n);
   if(n>=5&&R()<.3+d*.5){const s=x0+2+(R()*(n-4)|0),w=1+(R()*(1+d*2)|0);for(let i=0;i<w&&s+i<x-1;i++)M[s+i][gy-1]=2}
   if(R()<.4+d*.5)ens.push(mk(x0+(n>>1),gy-1,R,d));
   if(R()<.5)for(let i=0;i<n;i++)coins.push({x:(x0+i)*T+16,y:(gy-3)*T+16})
  }else if(r<.52){const w=2+Math.min(2,(d*3+R()*1.2)|0),x0=x;lg=1;
   for(let i=0;i<w;i++){M[x][RW-2]=3;M[x][RW-1]=3;x++}
   if(w>=3&&R()<.5){M[x0+(w>>1)][gy-2]=1;coins.push({x:(x0+(w>>1))*T+16,y:(gy-4)*T+16})}
  }else if(r<.64){gy=Math.max(8,Math.min(13,gy+(R()<.5?-1:1)*(1+(R()<.3?1:0))));flat(3+(R()*3|0))
  }else if(r<.78){const x0=x;flat(5);for(let i=1;i<4;i++){M[x0+i][gy-3]=1;coins.push({x:(x0+i)*T+16,y:(gy-4)*T+16})}if(R()<.5)ens.push(mk(x0+2,gy-4,R,d))
  }else{const x0=x;flat(6);if(d>.15){M[x0+2][gy-1]=2;M[x0+4][gy-1]=2}if(R()<.5)ens.push(mk(x0+3,gy-1,R,d))}
 }
 for(;x<cols;x++)col(x,gy);
 flagX=(cols-3)*T;let fy=0;while(!M[cols-3][fy])fy++;flagY=fy*T;
 if(l==h.L-1)ens.push(mk(cols-9,gy-1,R,d,true));
}

function start(c,l){ci=mc=c;li=l;gen(c,l);P={x:2*T,y:12*T-30,w:22,h:30,vx:0,vy:0,f:1,g:0,hp:5,inv:0,cd:0,at:0,kb:0};cam=0;ar=[];pt=[];state='play';document.body.classList.remove('mn');$('m').style.display='none'}
function next(){if(li+1<CH[ci].L)start(ci,li+1);else if(ci+1<CH.length)start(ci+1,0);else menu('🏆 You beat all 7 chapters!')}
const bk='<div style="margin-top:10px"><button class="t" id="bb">← Back</button></div>',AN={l:'Move left',r:'Move right',j:'Jump',a:'Attack',s:'Switch weapon'};
let listen=null;
const kn=k=>k==' '?'Space':k.length==1?k.toUpperCase():k.replace('Arrow',''),DB=()=>({l:['ArrowLeft','a'],r:['ArrowRight','d'],j:['ArrowUp','w',' '],a:['x','j','z'],s:['q']});
function scr(h){state='menu';document.body.classList.add('mn');const m=$('m');m.style.display='block';m.innerHTML=h;return m}
function menu(msg){scr(`<h1>⚔ LEP QUEST</h1><p>${msg||(PR.name?'Hero: '+esc(PR.name):'Welcome, hero!')} · 🪙 ${gold}</p><div class="mb"><button id="b1">▶ Start</button><button id="b2">⏩ Continue · ${CH[ci].n} ${li+1}</button><button id="b3">🛒 Shop</button><button id="b4">⚙ Settings</button><button id="b5">💾 Save progress</button></div>`);
 $('b1').onclick=levels;$('b2').onclick=()=>start(ci,li);$('b3').onclick=()=>shop();$('b4').onclick=settings;$('b5').onclick=()=>{sv();menu('💾 Progress saved!')}}
function levels(){const m=scr(`<h1>Choose a level</h1><div>${CH.map((c,i)=>`<button class="t${i==mc?' on':''}" data-c="${i}" ${gi(i,0)>prog?'disabled':''}>${i+1}. ${c.n}</button>`).join('')}</div><div id="g">${Array.from({length:CH[mc].L},(_,i)=>{const g=gi(mc,i);return`<button class="l${g<prog?' dn':''}" data-l="${i}" ${g>prog?'disabled':''}>${i+1}</button>`}).join('')}</div>${bk}`);
 m.querySelectorAll('.t').forEach(b=>b.onclick=()=>{mc=+b.dataset.c;levels()});m.querySelectorAll('.l').forEach(b=>b.onclick=()=>start(mc,+b.dataset.l));$('bb').onclick=()=>menu()}
function shop(msg){const m=scr(`<h1>🛒 Shop</h1><p>${msg||'Buy weapons with the coins you collect'} · 🪙 ${gold}</p><div class="sg">${WP.map((w,i)=>{const o=own.includes(i);return`<div class="c"><div class="ic">${IC[i]}</div><b>${w.n}</b><small>${w.rng==1?'Arrows, 1 dmg':w.rng==2?'Fireball, 2 dmg':'Melee, '+w.dmg+' dmg'}</small><button data-i="${i}" ${o||gold<w.p?'disabled':''}>${o?'Owned':'🪙 '+w.p}</button></div>`}).join('')}<div class="c"><div class="ic">➶</div><b>Arrows</b><small>${arrows}/25</small><button id="ba" ${arrows>=25||gold<15?'disabled':''}>+10 · 🪙 15</button></div></div>${bk}`);
 m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,w=WP[i];if(gold>=w.p&&!own.includes(i)){gold-=w.p;own.push(i);if(w.rng==1)arrows=Math.min(25,arrows+15);if(wp<0)wp=i;sv();shop('Bought '+w.n+'!')}});
 $('ba').onclick=()=>{if(gold>=15&&arrows<25){gold-=15;arrows=Math.min(25,arrows+10);sv();shop()}};$('bb').onclick=()=>menu()}
function settings(){const m=scr(`<h1>⚙ Settings</h1><p>Controls: click one, then press the new key</p>${Object.keys(AN).map(a=>`<div class="row"><span>${AN[a]}</span><button class="t" data-a="${a}">${listen==a?'Press a key…':kn(binds[a][0])}</button></div>`).join('')}<div style="margin-top:12px"><button class="t" id="sp">👤 Change profile</button><button class="t" id="sr">↺ Reset controls</button><button class="t" id="sf">⛶ Fullscreen</button></div>${bk}`);
 m.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{listen=b.dataset.a;settings()});
 $('sp').onclick=()=>profile();$('sr').onclick=()=>{binds=DB();listen=null;sv();settings()};$('sf').onclick=()=>{const d=document.documentElement;try{(d.requestFullscreen||d.webkitRequestFullscreen).call(d)}catch(e){}try{screen.orientation.lock('landscape').catch(()=>0)}catch(e){}};$('bb').onclick=()=>{listen=null;menu()}}
function profile(msg){const m=scr(`<h1>👤 Profiles</h1><p>${msg||'Pick a profile to switch to, or create a new one.'}</p><div class="sg">${Object.keys(ALL.p).map(n=>{const q=ALL.p[n],c=n==PR.name;return`<div class="c"><div class="ic">${c?'⭐':'👤'}</div><b>${esc(n)}</b><small>${c?prog:q.prog||0} levels · 🪙 ${c?gold:q.gold||0}</small><button data-n="${esc(n)}" ${c?'disabled':''}>${c?'Playing':'Switch'}</button></div>`}).join('')}</div><p>New profile</p><input id="pn" maxlength="16" placeholder="Enter a name"><div style="margin-top:10px"><button class="t on" id="ps">Create and switch</button></div>${bk}`);
 m.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>swp(b.dataset.n));
 $('ps').onclick=()=>{const n=esc($('pn').value).trim().slice(0,16);if(n)swp(n);else profile('Type a name first')};$('bb').onclick=settings}
function swp(n){sv();PR=ALL.p[n]||{name:n};ALL.p[n]=PR;ALL.cur=n;wr();
 prog=PR.prog||0;score=PR.score||0;gold=PR.gold||0;own=PR.own||[];arrows=PR.arrows||0;binds=PR.binds||DB();ci=PR.ci||0;li=PR.li||0;wp=PR.wp??-1;if(!own.includes(wp))wp=own.length?own[0]:-1;
 start(ci,li);menu('Switched to '+n+'!')}

function mv(o){o.gr=o.wl=false;o.x+=o.vx;
 let a=Math.floor(o.x/T),b=Math.floor((o.x+o.w-.01)/T),c=Math.floor(o.y/T),d=Math.floor((o.y+o.h-.01)/T);
 if(o.vx)for(let i=a;i<=b;i++)for(let j=c;j<=d;j++)if(sol(i,j)){o.wl=true;o.x=o.vx>0?i*T-o.w:(i+1)*T;break}
 o.y+=o.vy;a=Math.floor(o.x/T);b=Math.floor((o.x+o.w-.01)/T);c=Math.floor(o.y/T);d=Math.floor((o.y+o.h-.01)/T);
 Y:for(let i=a;i<=b;i++)for(let j=c;j<=d;j++)if(sol(i,j)){if(o.vy>0){o.y=j*T-o.h;o.gr=true}else o.y=(j+1)*T;o.vy=0;break Y}}
function burst(x,y,c,n){for(let i=0;i<n;i++)pt.push({x,y,vx:(Math.random()-.5)*6,vy:-Math.random()*5,l:30,c})}
function hurt(f){if(P.inv>0)return;P.hp--;P.inv=80;P.vy=-6;P.vx=f*5;P.kb=10;burst(P.x+11,P.y+15,'#fff',8);if(P.hp<=0)die()}
function die(){if(state!='play')return;state='dead';sv();burst(P.x+11,P.y+15,'#ffd34d',20)}
function dmg(e,n,f){e.hp-=n;e.fl=8;e.kb=e.boss?0:f*5;burst(e.x+e.w/2,e.y+e.h/2,CH[ci].m,6);if(e.hp<=0){score+=e.boss?1000:100;gold+=e.boss?50:3;burst(e.x+e.w/2,e.y+e.h/2,'#ffd34d',14)}}
function attack(){if(wp<0)return;const w=WP[wp];
 if(w.rng==1){if(arrows<1){toast('Out of arrows! Buy more in the shop');P.cd=15;return}arrows--;ar.push({x:P.x+11+P.f*14,y:P.y+14,vx:P.f*10,vy:-.6,n:0})}
 else if(w.rng==2)ar.push({x:P.x+11+P.f*20,y:P.y+14,vx:P.f*7,vy:0,fire:1,n:0});
 else{const bx=P.f>0?P.x+P.w:P.x-w.r,by=P.y+15-w.hh/2;for(const e of ens)if(e.hp>0&&e.x<bx+w.r&&e.x+e.w>bx&&e.y<by+w.hh&&e.y+e.h>by)dmg(e,w.dmg,P.f)}
 P.cd=w.cd;P.at=10}

function step(){fr++;const k=K;let ax=(k.r?1:0)-(k.l?1:0);
 if(P.kb>0)P.kb--;else{P.vx+=(ax*4.2-P.vx)*.25;if(ax)P.f=ax}
 P.g=P.gr?7:P.g-1;jb--;
 if(jb>0&&P.g>0){P.vy=-11.2;jb=0;P.g=0}
 if(!k.j&&P.vy<-3.5)P.vy=-3.5;
 P.vy=Math.min(P.vy+.55,12);mv(P);if(P.wl)P.vx=0;
 P.cd--;P.at--;P.inv--;if(k.a&&P.cd<=0)attack();
 for(const e of ens){if(e.hp<=0)continue;if(e.fl>0)e.fl--;if(Math.abs(e.x-P.x)>VW)continue;
  if(e.k==2){e.t+=.05;e.x+=e.dir*e.sp;if(Math.abs(e.x-e.x0)>110)e.dir*=-1;e.y=e.by+Math.sin(e.t)*36}
  else{e.vy=Math.min(e.vy+.55,12);e.vx=e.kb?e.kb:e.dir*e.sp;if(e.kb){e.kb*=.7;if(Math.abs(e.kb)<.5)e.kb=0}
   mv(e);if(e.wl)e.dir*=-1;
   if(e.gr){if(e.k==1&&--e.j<=0){e.vy=-9;e.j=50}
    if(!e.kb&&!sol(Math.floor((e.dir>0?e.x+e.w+2:e.x-2)/T),Math.floor((e.y+e.h+4)/T)))e.dir*=-1}}
  if(P.x<e.x+e.w&&P.x+P.w>e.x&&P.y<e.y+e.h&&P.y+P.h>e.y){if(P.vy>1&&P.y+P.h-e.y<20){dmg(e,1,P.f);P.vy=-8}else hurt(P.x<e.x?-1:1)}}
 ar=ar.filter(a=>{a.x+=a.vx;if(!a.fire)a.vy+=.06;a.y+=a.vy;if(sol(a.x/T|0,a.y/T|0)||a.y>VH||(a.fire&&++a.n>60))return false;
  for(const e of ens)if(e.hp>0&&a.x>e.x&&a.x<e.x+e.w&&a.y>e.y&&a.y<e.y+e.h){dmg(e,a.fire?2:1,Math.sign(a.vx));return false}return true});
 const x0=P.x/T|0,x1=(P.x+P.w-1)/T|0,y0=P.y/T|0,y1=(P.y+P.h-1)/T|0;
 for(let tx=x0;tx<=x1;tx++)for(let ty=y0;ty<=y1;ty++){if(tx<0||tx>=cols||ty<0||ty>=RW)continue;const t=M[tx][ty];if(t==3)die();else if(t==2&&P.y+P.h>ty*T+16)hurt(-P.f)}
 if(P.y>VH+40)die();
